<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>팀 정책 실험실</title>
<style>body{background:#17191a;color:#eceff0;font:16px system-ui;margin:24px}h1{font-size:25px}p{color:#adb6bb;line-height:1.6}select{max-width:100%;padding:10px}main{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:20px}canvas{width:100%;background:#262b2e}img{width:100%;background:#333}article{border:1px solid #42494c;padding:16px;border-radius:12px}dt{color:#aeb9c0}dd{margin:0 0 14px}a{color:#82c7ff}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}@media(max-width:800px){main{grid-template-columns:1fr}}</style>
<h1>팀 정책 실험실</h1><p>각자 설치한 Jazzy 시뮬의 이동·마커 등록·최종 평가를 비교합니다. 배경은 평가용 정답 장면이며 SLAM 지도가 아닙니다. 정답은 정책에 전달하지 않습니다.</p>
<select id="runs" aria-label="실험 선택"></select><p id="empty">실험을 기다리는 중입니다.</p>
<main><article><canvas id="map" width="1100" height="700"></canvas><p>파랑은 실제 이동 궤적, 네모는 마커입니다. 초록은 등록 후 실제 1.5m 접근을 확인한 마커입니다.</p><a id="video">완료 영상</a> · <a id="evaluation">평가 JSON</a></article><article><img id="camera" alt="실제 Gazebo RGB"><dl id="stats"></dl><details><summary>실행 조건</summary><pre id="config"></pre></details></article></main>
<script>
const $=s=>document.getElementById(s);let selected='';$('runs').onchange=()=>{selected=$('runs').value;refresh()};
function draw(d){let c=$('map'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);let [w,h]=d.scene.room_size||[20.15,11.35];let s=Math.min((c.width-70)/(w+1),(c.height-70)/(h+1.5));let X=v=>c.width/2+v*s,Y=v=>c.height/2-v*s;x.strokeStyle='#dde2e3';x.strokeRect(X(-w/2),Y(h/2),w*s,h*s);
for(let b of [...(d.scene.partitions||[]),...(d.scene.obstacles||[])]){x.save();x.translate(X(b.x),Y(b.y));x.rotate(-(b.yaw||0));x.fillStyle='#c4b79d';x.fillRect(-b.sx*s/2,-b.sy*s/2,b.sx*s,b.sy*s);x.restore()}
x.strokeStyle='#64b3f5';x.lineWidth=3;x.beginPath();d.path.forEach((p,i)=>i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])));x.stroke();if(d.path.length){let p=d.path.at(-1);x.fillStyle='#fff';x.beginPath();x.arc(X(p[0]),Y(p[1]),6,0,7);x.fill()}
for(let t of d.scene.targets||[]){x.fillStyle=d.approached.includes(t.id)?'#18b88c':'#d8a55e';x.fillRect(X(t.x)-5,Y(t.y)-5,10,10);x.fillStyle='#fff';x.font='17px system-ui';x.fillText(t.id,X(t.x)+8,Y(t.y)-7)}}
let busy=false;async function refresh(){if(busy)return;busy=true;try{let ids=await(await fetch('/api/runs')).json();$('empty').hidden=!!ids.length;if(!ids.length)return;if(!ids.includes(selected))selected=ids[0];let select=$('runs');select.replaceChildren(...ids.map(id=>{let o=document.createElement('option');o.value=id;o.textContent=id;o.selected=id===selected;return o}));let d=await(await fetch('/api/run?id='+encodeURIComponent(selected))).json();draw(d);$('stats').replaceChildren();for(let [a,b] of [['상태',d.interrupted?'중단 기록':d.finished?'종료':d.reason],['시뮬 경과',d.elapsed.toFixed(1)+'초'],['등록 ID',d.ids.join(', ')||'없음'],['실제 1.5m 접근',d.approached.join(', ')||'진행 중에는 최종 확인 대기'],['엄격 성공',d.strict===null?'평가 대기':d.strict?'통과':'미달'],['범퍼',d.bumps===null?'최종 집계 대기':d.bumps]]){let dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=a;dd.textContent=b;$('stats').append(dt,dd)}$('config').textContent=JSON.stringify(d.protocol,null,2);$('camera').src='/camera.jpg?id='+encodeURIComponent(d.id)+'&t='+Date.now();$('video').href='/video.mp4?id='+encodeURIComponent(d.id);$('video').hidden=!d.finished;$('evaluation').href='/evaluation.json?id='+encodeURIComponent(d.id)}catch(e){$('empty').hidden=false;$('empty').textContent='기록 수신 대기: '+e.message}finally{busy=false}}
setInterval(refresh,2000);refresh();
</script></html>
